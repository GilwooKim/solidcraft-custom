name: Custom Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content packaging/windows/custom-version.txt -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and custom-version.txt must match.' }
          "SOLIDCRAFT_VERSION=$version" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tool
        run: choco install innosetup --yes --no-progress
      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/build-custom.ps1
      - name: Verify update behavior
        run: |
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui update::
      - name: Verify workbench and language settings
        shell: pwsh
        run: |
          cargo test --locked --profile ci --lib -p solidcraft-engine luggage
          if ($LASTEXITCODE -ne 0) { throw 'Workbench command tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui luggage
          if ($LASTEXITCODE -ne 0) { throw 'Workbench interface tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui promoted_long_labels_have_compact_ribbon_names
          if ($LASTEXITCODE -ne 0) { throw 'Compact ribbon label tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui generic_export_
          if ($LASTEXITCODE -ne 0) { throw 'Export picker tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui custom_install_languages_switch_and_persist
          if ($LASTEXITCODE -ne 0) { throw 'Language preference tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui every_complete_catalog_carries_every_english_message
          if ($LASTEXITCODE -ne 0) { throw 'Translation coverage tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-ui-egui every_file_format_label_is_in_the_english_catalog
          if ($LASTEXITCODE -ne 0) { throw 'File format label coverage tests failed.' }
          cargo test --locked --profile ci -p xtask installer_languages_cannot_regress_to_partial_catalogs
          if ($LASTEXITCODE -ne 0) { throw 'Required installer language coverage tests failed.' }
          cargo test --locked --profile ci -p solidcraft --bin solidcraft installer_language_is_only_a_first_run_default
          if ($LASTEXITCODE -ne 0) { throw 'Installer language tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-io stl_quirks_read_cleanly
          if ($LASTEXITCODE -ne 0) { throw 'STL damage reporting tests failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-io formats::tests
          if ($LASTEXITCODE -ne 0) { throw 'File compatibility registry tests failed.' }
      - name: Verify STEP curve recovery
        shell: pwsh
        run: |
          cargo test --locked --manifest-path solidcore/Cargo.toml -p solidcore --lib nurbs::crv_fit::p1
          if ($LASTEXITCODE -ne 0) { throw 'Curve interpolation tests failed.' }
          cargo test --locked --manifest-path solidcore/Cargo.toml -p solidcore --lib topology::edgeuse::p3
          if ($LASTEXITCODE -ne 0) { throw 'Boundary interpolation tests failed.' }
          cargo test --locked --manifest-path solidcore/Cargo.toml -p solidcore --lib pcurve
          if ($LASTEXITCODE -ne 0) { throw 'Surface curve domain tests failed.' }
          cargo test --locked --manifest-path solidcore/Cargo.toml -p solidcore-step --lib
          if ($LASTEXITCODE -ne 0) { throw 'STEP reader and writer tests failed.' }
          cargo test --locked --manifest-path solidcore/Cargo.toml -p solidcore --test derive_revolved_supports
          if ($LASTEXITCODE -ne 0) { throw 'Analytic surface recognition tests failed.' }
      - name: Verify corrected geometry regressions
        shell: pwsh
        run: |
          cargo test --locked --profile ci --lib -p solidcraft-engine a_body_with_round_pieces_swept_under_a_degree_takes_a_later_round
          if ($LASTEXITCODE -ne 0) { throw 'Short-sweep fillet regression failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-engine a_hole_wider_than_the_part_says_it_removes_all_of_it
          if ($LASTEXITCODE -ne 0) { throw 'Tangent hole partition regression failed.' }
          cargo test --locked --profile ci --lib -p solidcraft-kernel issue2422_
          if ($LASTEXITCODE -ne 0) { throw 'Explicit and propagated bottom-round regressions failed.' }
      - name: Smoke test modeling and export
        shell: pwsh
        run: |
          & ./target/ci/solidcraft-cli.exe run examples/custom-plate.json --out target/custom-plate.step
          if ($LASTEXITCODE -ne 0) { throw 'STEP smoke test failed.' }
          & ./target/ci/solidcraft-cli.exe run examples/custom-plate.json --out target/custom-plate.stl
          if ($LASTEXITCODE -ne 0) { throw 'STL smoke test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/custom/*/*
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release
      - name: Publish release candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sums=$(find release -type f -name SHA256SUMS.txt -print -quit)
          test -n "$sums"
          cd "$(dirname "$sums")"
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* --verify-tag --prerelease --latest=false --title "SolidCraft Custom $RELEASE_TAG" --generate-notes
